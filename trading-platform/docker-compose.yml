version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    environment:
      - APP_NAME=FinanceAI Trading Platform
      - DEBUG=true
      - PAPER_TRADING=true
      - INITIAL_BALANCE=100000.0
      - MAX_POSITION_SIZE=0.10
      - STOP_LOSS_PCT=0.05
      - TAKE_PROFIT_PCT=0.15
      - DATABASE_URL=sqlite+aiosqlite:///./data/trading.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    networks:
      - financeai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - financeai-net

volumes:
  backend-data:

networks:
  financeai-net:
    driver: bridge
