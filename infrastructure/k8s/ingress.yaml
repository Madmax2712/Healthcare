apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthguard-ingress
  namespace: healthguard
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/websocket-services: "healthguard-backend-svc"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - api.healthguard.com
        - portal.healthguard.com
      secretName: healthguard-tls
  rules:
    - host: api.healthguard.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthguard-backend-svc
                port:
                  number: 80
    - host: portal.healthguard.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthguard-portal-svc
                port:
                  number: 80
