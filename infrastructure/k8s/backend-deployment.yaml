apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthguard-backend
  namespace: healthguard
  labels:
    app: healthguard
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: healthguard
      component: backend
  template:
    metadata:
      labels:
        app: healthguard
        component: backend
    spec:
      containers:
        - name: backend
          image: healthguard/backend:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: healthguard-secrets
                  key: db-host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthguard-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healthguard-secrets
                  key: jwt-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healthguard-secrets
                  key: anthropic-api-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: healthguard-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: healthguard-backend-svc
  namespace: healthguard
spec:
  selector:
    app: healthguard
    component: backend
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthguard-backend-hpa
  namespace: healthguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthguard-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
