apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthguard-portal
  namespace: healthguard
  labels:
    app: healthguard
    component: portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthguard
      component: portal
  template:
    metadata:
      labels:
        app: healthguard
        component: portal
    spec:
      containers:
        - name: portal
          image: healthguard/portal:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.healthguard.com/api/v1"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.healthguard.com"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: healthguard-portal-svc
  namespace: healthguard
spec:
  selector:
    app: healthguard
    component: portal
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
